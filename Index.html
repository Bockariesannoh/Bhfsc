<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Entry Form</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 10px; }
    form { max-width: 400px; margin: auto; }
    label { display: block; margin-top: 10px; }
    input, textarea, button { width: 100%; padding: 8px; margin-top: 5px; }
    .horizontal { display: flex; gap: 10px; margin-top: 5px; }
    button { margin-top: 15px; }
  </style>
</head>
<body>

<h2>Product Entry Form</h2>

<form id="entryForm">
  <label>Product Name <input type="text" id="productName" required></label>
  <label>Description <textarea id="description"></textarea></label>
  <label>Color <input type="text" id="color"></label>

  <label>Category</label>
  <div class="horizontal">
    <label><input type="radio" name="category" value="Shoes" required> Shoes</label>
    <label><input type="radio" name="category" value="T-Shirt"> T-Shirt</label>
  </div>

  <label>Size</label>
  <div id="sizeOptions" class="horizontal"></div>

  <label>Image 1 <input type="file" id="image1" accept="image/*"></label>
  <label>Image 2 <input type="file" id="image2" accept="image/*"></label>

  <button type="button" onclick="clearForm()">Clear</button>
  <button type="submit">Save</button>
</form>

<script>
const scriptURL = "YOUR_WEB_APP_URL"; // Replace with Apps Script Web App URL

const sizeOptionsDiv = document.getElementById("sizeOptions");
document.querySelectorAll("input[name='category']").forEach(radio => {
  radio.addEventListener("change", function() {
    sizeOptionsDiv.innerHTML = "";
    if (this.value === "Shoes") {
      ["40","41","42","43"].forEach(size => {
        sizeOptionsDiv.innerHTML += `<label><input type="checkbox" name="size" value="${size}"> ${size}</label>`;
      });
    } else {
      ["S","M","L","XL"].forEach(size => {
        sizeOptionsDiv.innerHTML += `<label><input type="checkbox" name="size" value="${size}"> ${size}</label>`;
      });
    }
  });
});

function clearForm() {
  document.getElementById("entryForm").reset();
  sizeOptionsDiv.innerHTML = "";
}

document.getElementById("entryForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const productName = document.getElementById("productName").value;
  const description = document.getElementById("description").value;
  const color = document.getElementById("color").value;
  const category = document.querySelector("input[name='category']:checked").value;
  const sizes = [...document.querySelectorAll("input[name='size']:checked")].map(s => s.value).join(", ");

  async function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  let images = [];
  for (let inputId of ["image1", "image2"]) {
    let fileInput = document.getElementById(inputId);
    if (fileInput.files.length > 0) {
      let file = fileInput.files[0];
      let base64 = await toBase64(file);
      images.push({
        name: file.name,
        type: file.type,
        data: base64.split(",")[1]
      });
    }
  }

  let data = {
    productName, description, color, category, size: sizes, images
  };

  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify(data),
    headers: { "Content-Type": "application/json" }
  })
  .then(res => res.json())
  .then(response => {
    alert("Data saved successfully!");
    clearForm();
  })
  .catch(err => console.error("Error:", err));
});
</script>

</body>
</html>
